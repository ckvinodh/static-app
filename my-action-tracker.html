<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Action Tracker</title>
<style>
  :root {
    --primary: #0078D4;
    --primary-dark: #005A9E;
    --primary-soft: #DEECF9;
    --line: rgba(0, 120, 212, 0.22);
    --ink: #1B1A19;
    --ink-soft: #605E5C;
    --ink-faint: #8A8886;
    --radius: 12px;
    --shadow-sm: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.04);
    --shadow-md: 0 4px 16px rgba(0,120,212,.08), 0 1px 3px rgba(16,24,40,.06);
    --shadow-lg: 0 24px 48px rgba(16,24,40,.18);
    --red: #D13438;
    --amber: #B87A00;
    --green: #0B6A0B;
    --violet: #6B4EBB;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, #F3F2F1 0%, #FFF 45%, #EEF6FF 100%);
    font-size: 14px;
    line-height: 1.5;
    overflow: hidden;
  }

  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* ---------- Shell ---------- */
  .app { display: grid; grid-template-columns: 244px minmax(0, 1fr); height: 100vh; }

  .sidebar {
    border-right: 1px solid var(--line);
    background: rgba(255,255,255,.75);
    backdrop-filter: blur(12px);
    padding: 18px 13px;
    display: flex; flex-direction: column; gap: 20px;
    overflow-y: auto;
  }

  .main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }

  .workspace {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(300px, 360px) minmax(0, 1fr);
    min-height: 0;
  }

  .list-pane { overflow-y: auto; border-right: 1px solid var(--line); padding: 10px; text-align: left; }
  .detail-pane { overflow-y: auto; padding: 22px 26px 60px; background: rgba(255,255,255,.55); text-align: left; }
  .workspace, .card, .card-body, .group-head { text-align: left; }

  /* ---------- Sidebar ---------- */
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 5px; }

  .brand-mark {
    width: 36px; height: 36px; display: grid; place-items: center;
    border-radius: 10px; color: #fff;
    background: linear-gradient(135deg, var(--primary), #4CA6E8);
    box-shadow: 0 4px 12px rgba(0,120,212,.32);
  }

  .brand-title { font-weight: 700; font-size: 13.5px; }
  .brand-sub { font-size: 11px; color: var(--ink-faint); }

  .nav-group-label {
    display: flex; align-items: center;
    padding: 0 8px 7px;
    font-size: 10px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink-faint);
  }

  .nav-group-toggle {
    display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 0; color: inherit; text-align: left;
    font-size: inherit; font-weight: inherit; letter-spacing: inherit;
    text-transform: inherit;
  }

  .nav-group-toggle svg { transition: transform .15s; }
  .nav-group-toggle[aria-expanded="false"] svg { transform: rotate(-90deg); }
  .nav-group-actions { margin-left: auto; display: flex; align-items: center; }

  .nav { display: flex; flex-direction: column; gap: 2px; }

  .nav-item, .person-btn, .project-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 8px 10px;
    border-radius: 8px; color: var(--ink-soft);
    text-align: left; font-size: 13px;
    transition: background .15s, color .15s;
  }

  .nav-item:hover, .person-btn:hover, .project-btn:hover {
    background: rgba(0,120,212,.06); color: var(--primary-dark);
  }

  .nav-item.active, .person-btn.active, .project-btn.active {
    background: var(--primary-soft); color: var(--primary-dark); font-weight: 600;
  }

  .nav-item.active { box-shadow: inset 2px 0 0 var(--primary); }
  .nav-item svg { flex-shrink: 0; }
  .nav-label { flex: 1; min-width: 0; }

  .pill {
    min-width: 22px; padding: 1px 7px; border-radius: 999px;
    font-size: 11px; font-weight: 700; text-align: center;
    background: rgba(0,0,0,.05); color: var(--ink-soft);
  }

  .nav-item.active .pill { background: #fff; color: var(--primary-dark); }
  .pill.alert { background: #FDE7E9; color: var(--red); }
  .person-btn .pill, .project-btn .pill { margin-left: auto; }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--primary); flex-shrink: 0; }

  /* ---------- Header ---------- */
  .topbar {
    border-bottom: 1px solid var(--line);
    background: rgba(255,255,255,.9);
    backdrop-filter: blur(12px);
    padding: 14px 22px 11px;
    flex-shrink: 0;
  }

  .topbar-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
  .subtitle { margin-top: 2px; font-size: 12px; color: var(--ink-faint); }
  .topbar-actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }

  .toolbar { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; align-items: center; }

  .scope { display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(0,0,0,.05); gap: 2px; }

  .scope button {
    padding: 6px 14px; border-radius: 999px;
    font-size: 12.5px; font-weight: 600; color: var(--ink-soft); white-space: nowrap;
  }

  .scope button.on { background: #fff; color: var(--primary-dark); box-shadow: var(--shadow-sm); }

  .search { position: relative; flex: 1 1 220px; min-width: 0; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); pointer-events: none; }

  .field {
    height: 36px; width: 100%; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 8px; background: #fff;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }

  .search .field { padding-left: 35px; }
  .field:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,120,212,.14); }
  select.field { appearance: none; padding-right: 30px; cursor: pointer; }
  .select-wrap { position: relative; }
  .select-wrap svg { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); pointer-events: none; }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 15px; border-radius: 8px;
    font-size: 13px; font-weight: 600; color: #fff; background: var(--primary);
    box-shadow: 0 2px 8px rgba(0,120,212,.28); transition: background .15s;
  }

  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary.full { width: 100%; justify-content: center; margin-top: 8px; }

  .btn-soft, .btn-ghost {
    display: inline-flex; align-items: center; gap: 7px;
    height: 36px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 8px; background: #fff;
    color: var(--ink-soft); font-size: 12.5px; font-weight: 600; white-space: nowrap;
  }

  .btn-soft:hover, .btn-ghost:hover { border-color: var(--primary); color: var(--primary-dark); background: var(--primary-soft); }
  .btn-soft[disabled] { opacity: .6; cursor: default; }
  .btn-ghost.on { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-dark); }
  .scan-meta { font-size: 11px; color: var(--ink-faint); white-space: nowrap; }
  .spin { animation: spin .9s linear infinite; display: inline-flex; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .filter-bar {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 9px; padding: 9px;
    border: 1px solid var(--line); border-radius: 10px; background: rgba(222,236,249,.4);
  }

  /* ---------- List pane ---------- */
  .group-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 8px 7px;
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .06em; color: var(--ink-faint);
  }

  .count-chip {
    padding: 0 7px; border-radius: 999px; background: rgba(0,0,0,.05);
    font-size: 10.5px; font-weight: 700; color: var(--ink-soft);
  }

  .card {
    display: flex; gap: 10px; align-items: flex-start;
    width: 100%; text-align: left;
    padding: 8px 9px; margin-bottom: 4px;
    border: 1px solid var(--line); border-left: 5px solid var(--card-priority, var(--line)); border-radius: 10px;
    background: #fff; box-shadow: var(--shadow-sm);
    transition: border-color .15s, box-shadow .15s, background .15s;
  }

  .card.priority-Critical { --card-priority: var(--red); }
  .card.priority-Medium { --card-priority: var(--amber); }
  .card.priority-High { --card-priority: #7A4A20; }
  .card.priority-Low { --card-priority: var(--green); }

  .card:hover { border-color: var(--line); border-left-color: var(--card-priority, var(--line)); box-shadow: var(--shadow-md); }

  .card.active {
    border-color: var(--line);
    border-left-color: var(--card-priority, var(--line));
    background: var(--primary-soft);
    box-shadow: var(--shadow-md);
  }

  .card-body { min-width: 0; flex: 1; }
  .card-title { font-size: 12px; font-weight: 600; line-height: 1.3; }
  .card.done .card-title { color: var(--ink-faint); text-decoration: line-through; }
  .card-meta { margin-top: 2px; font-size: 10px; color: var(--ink-faint); }
  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; align-items: center; }
  .today-star { display: grid; place-items: center; padding: 3px; color: var(--ink-faint); border-radius: 5px; }
  .today-star:hover, .today-star.active { color: #B87A00; background: #FFF4E5; }

  .check { margin-top: 1px; flex-shrink: 0; color: var(--ink-faint); display: grid; }
  .check:hover { color: var(--green); }
  .check.done { color: var(--green); }

  .prio-dot { width: 7px; height: 7px; border-radius: 999px; flex-shrink: 0; }
  .prio-High { background: var(--red); }
  .prio-Medium { background: var(--amber); }
  .prio-Low { background: #9AA0A6; }

  .status {
    display: inline-flex; padding: 2px 9px; border-radius: 999px;
    border: 1px solid; font-size: 10.5px; font-weight: 600; white-space: nowrap;
    min-width: 82px; justify-content: center; text-align: center;
  }

  .status.Pending,
  .status.Open { border-color: #A9D3F2; background: #EFF8FF; color: var(--primary-dark); }
  .status.Waiting { border-color: #D6CCF2; background: #F4F0FF; color: var(--violet); }
  .status.Overdue { border-color: #F3B7B9; background: #FDE7E9; color: var(--red); }
  .status.Completed { border-color: #A7DFA7; background: #DFF6DD; color: var(--green); }

  .tag-new {
    padding: 1px 6px; border-radius: 4px; background: var(--primary);
    color: #fff; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em;
  }

  .note-count {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 10.5px; color: var(--primary-dark); font-weight: 600;
  }

  .avatar {
    display: grid; place-items: center; width: 24px; height: 24px; flex-shrink: 0;
    border-radius: 999px; font-size: 10px; font-weight: 700; color: #fff; background: var(--primary);
    line-height: 1; text-align: center;
  }

  .avatar.me { background: linear-gradient(135deg, var(--primary), #4CA6E8); }
  .avatar.unassigned { background: #C8C6C4; color: #605E5C; }
  .avatar.sm { width: 18px; height: 18px; font-size: 10px !important; }

  /* ---------- Detail pane ---------- */
  .detail-empty {
    height: 100%; display: grid; place-content: center; text-align: center;
    color: var(--ink-faint); gap: 8px;
  }

  .detail-head { display: flex; align-items: flex-start; gap: 12px; }
  .detail-title { font-size: 19px; font-weight: 700; line-height: 1.35; letter-spacing: -.01em; }
  .detail-title.done { color: var(--ink-faint); text-decoration: line-through; }
  .detail-sub { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }

  .d-section { margin-top: 20px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }

  .d-label {
    display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
    font-size: 10px; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; color: var(--ink-faint);
  }

  .context {
    display: flex; align-items: flex-start; gap: 11px;
    padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: linear-gradient(90deg, rgba(222,236,249,.85), rgba(255,255,255,.9));
  }

  .context-icon {
    display: grid; place-items: center; width: 32px; height: 32px; flex-shrink: 0;
    border-radius: 9px; background: var(--primary); color: #fff;
  }

  .context-when { font-size: 13px; font-weight: 700; }
  .context-where { margin-top: 2px; font-size: 12px; color: var(--ink-soft); }
  .context-who { margin-top: 3px; font-size: 11.5px; color: var(--ink-faint); }

  .trigger {
    margin-top: 9px; padding: 10px 13px; border-radius: 8px;
    border: 1px solid #FDE7A9; background: #FFF8E6;
    font-size: 12.5px; line-height: 1.6; color: #6B4E00;
  }

  .trigger strong { color: #8A5300; }

  .quote {
    border-left: 3px solid var(--primary); border-radius: 0 8px 8px 0;
    background: #fff; padding: 11px 14px;
    font-size: 13px; line-height: 1.65; color: var(--ink-soft);
  }

  .quote p { margin: 0 0 8px; }
  .quote p:last-child { margin-bottom: 0; }
  .quote .speaker { font-weight: 700; color: var(--primary-dark); }

  .steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
  .steps li { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; line-height: 1.55; color: var(--ink-soft); }

  .steps li .n {
    display: grid; place-items: center; flex-shrink: 0;
    width: 19px; height: 19px; margin-top: 1px; border-radius: 999px;
    background: var(--primary-soft); color: var(--primary-dark);
    font-size: 10.5px; font-weight: 700;
  }

  .source-card { border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 13px 14px; }
  .source-head { display: flex; align-items: flex-start; gap: 10px; }

  .source-icon {
    display: grid; place-items: center; width: 30px; height: 30px; flex-shrink: 0;
    border-radius: 8px; background: var(--primary-soft); color: var(--primary-dark);
  }

  .source-subject { font-size: 13px; font-weight: 700; }
  .source-meta { margin-top: 2px; font-size: 11.5px; color: var(--ink-faint); }

  .btn-open {
    display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
    margin-left: auto; padding: 7px 13px; border-radius: 8px;
    border: 1px solid var(--primary); background: var(--primary-soft);
    color: var(--primary-dark); font-size: 12px; font-weight: 600;
    text-decoration: none; white-space: nowrap;
  }

  .btn-open:hover { background: var(--primary); color: #fff; }

  .atts { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; padding-top: 11px; border-top: 1px dashed var(--line); }

  .att {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px;
    border-radius: 7px; border: 1px solid var(--line); background: #FAFAFA;
    font-size: 11.5px; color: var(--ink-soft); text-decoration: none;
  }

  .att:hover { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-dark); }
  .att .sz { color: var(--ink-faint); font-size: 10.5px; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; }

  .chip {
    padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line);
    background: #fff; font-size: 11px; color: var(--ink-soft);
  }

  .detail-sub .chip.project-pill { border-color: #A9D3F2; background: #EFF8FF; color: #005A9E; }
  .detail-sub .chip.priority-pill { border-color: #F3C27B; background: #FFF4E5; color: #9A5700; }
  .detail-sub .chip.priority-pill.priority-Critical { border-color: #F3B7B9; background: #FDE7E9; color: #D13438; }
  .detail-sub .chip.priority-pill.priority-High { border-color: #C99A6A; background: #F8EFE6; color: #7A4A20; }
  .detail-sub .chip.priority-pill.priority-Medium { border-color: #F3C27B; background: #FFF4E5; color: #9A5700; }
  .detail-sub .chip.priority-pill.priority-Low { border-color: #A7DFA7; background: #DFF6DD; color: #0B6A0B; }
  .detail-sub .chip.due-pill { border-color: #D6CCF2; background: #F4F0FF; color: #6B4EBB; }
  .detail-sub .chip.owner-pill { border-color: #A7DFA7; background: #DFF6DD; color: #0B6A0B; }
  .detail-sub .status.Pending { border-color: #A9D3F2; background: #EFF8FF; color: #005A9E; }
  .detail-sub .status.Waiting { border-color: #F3C27B; background: #FFF4E5; color: #9A5700; }
  .detail-sub .status.Completed { border-color: #A7DFA7; background: #DFF6DD; color: #0B6A0B; }
  .detail-sub .status.Overdue { border-color: #F3B7B9; background: #FDE7E9; color: #D13438; }

  .matched {
    display: inline-flex; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
    background: #DFF6DD; color: var(--green); font-size: 10px; font-weight: 700;
  }

  /* ---------- Notes ---------- */
  .note-box {
    border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 12px;
  }

  .note-input {
    width: 100%; min-height: 76px; resize: vertical; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; outline: none;
    font-size: 13px; line-height: 1.55;
  }

  .rich-toolbar {
    display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px;
  }

  .rich-toolbar button {
    min-width: 30px; height: 28px; padding: 0 8px;
    border: 1px solid var(--line); border-radius: 6px;
    background: #fff; color: var(--ink-soft); font-weight: 700;
  }

  .rich-toolbar button:hover { border-color: var(--primary); color: var(--primary-dark); background: var(--primary-soft); }
  .rich-color {
    height: 28px; border: 1px solid var(--line); border-radius: 6px;
    background: #fff; color: var(--ink-soft); padding: 0 7px; font-weight: 700;
  }
  .rich-editor { min-height: 88px; overflow-y: auto; }
  .rich-editor:empty::before { content: attr(data-placeholder); color: var(--ink-faint); }
  .rich-editor ul, .rich-editor ol, .note-text ul, .note-text ol { margin: 6px 0 6px 22px; padding: 0; }
  .rich-editor li, .note-text li { margin: 2px 0; }

  .note-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,120,212,.14); }
  .note-actions { display: flex; align-items: center; gap: 9px; margin-top: 9px; flex-wrap: wrap; }
  .note-hint { font-size: 11px; color: var(--ink-faint); }

  .note {
    display: flex; gap: 10px; padding: 11px 0;
    border-bottom: 1px solid rgba(0,0,0,.06);
  }

  .note:last-child { border-bottom: none; }
  .note-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--primary); margin-top: 6px; flex-shrink: 0; }
  .note-when { font-size: 11px; font-weight: 700; color: var(--primary-dark); }
  .note-text { margin-top: 3px; font-size: 13px; line-height: 1.6; color: var(--ink-soft); white-space: normal; }

  .note-del {
    margin-left: auto; color: var(--ink-faint); opacity: 0; transition: opacity .15s;
    align-self: flex-start;
  }

  .note:hover .note-del { opacity: 1; }
  .note-del:hover { color: var(--red); }

  /* Product typography: keep the whole tracker consistent and compact. */
  body, body * { font-family: Calibri, "Segoe UI", sans-serif !important; font-size: 14px !important; }
  svg { font-size: initial !important; }

  .subtask-list { display: flex; flex-direction: column; gap: 7px; }
  .subtask-row { display: flex; align-items: flex-start; gap: 9px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .subtask-row { cursor: pointer; }
  .subtask-row[draggable="true"] { cursor: grab; }
  .subtask-row.drag-over { border-color: var(--primary); background: var(--primary-soft); }
  .subtask-row:hover { border-color: var(--primary); background: var(--primary-soft); }
  .subtask-row input[type="checkbox"] { margin-top: 3px; accent-color: var(--primary); }
  .subtask-row.done span { color: var(--ink-faint); text-decoration: line-through; }
  .subtask-add { display: flex; gap: 8px; margin-top: 9px; }
  .subtask-add input { flex: 1; min-width: 0; }
  .subtask-owner { margin-left: auto; font-size: 11px; color: var(--ink-faint); white-space: nowrap; }

  .checklist-section { margin-top: 14px; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
  .checklist-section summary { padding: 10px 12px; cursor: pointer; color: var(--primary-dark); font-size: 12px; font-weight: 700; }
  .checklist-section summary::marker { color: var(--primary); }
  .checklist-body { padding: 0 12px 12px; }
  .checklist-body .subtask-add { margin-top: 8px; }

  .checklist-overview { overflow-y: auto; padding: 24px 28px 60px; background: rgba(255,255,255,.55); }
  .checklist-overview-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  .checklist-overview-head h2 { margin: 0; font-size: 20px; }

/* ==================================================================
   Helpers
================================================================== */
const esc = v => String(v).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const effectiveStatus = t => {
  if (t.status === "Completed") return "Completed";
  if (t.due && t.due < TODAY) return "Overdue";
  return t.status === "Open" ? "Pending" : (t.status || "Pending");
};

const initials = o =>
  o === "Unassigned" ? "?" : String(o || "?").trim().charAt(0).toUpperCase();

const avatarClass = o =>
  o === ME ? "avatar me" : o === "Unassigned" ? "avatar unassigned" : "avatar";

const formatDate = v => new Date(v + "T00:00:00")
  .toLocaleDateString("en-GB", { day: "2-digit", month: "short" });

function titleCase(v) {
  return v.replace(/\w\S*/g, w => w[0].toUpperCase() + w.slice(1).toLowerCase());
}

function resolveName(raw, attendees) {
  if (!raw) return "Unassigned";
  const key = String(raw).trim().toLowerCase().replace(/[^a-z\s.]/g, "");
  if (!key) return "Unassigned";
  if (["i", "me", "you", "myself"].includes(key)) return ME;

  if (attendees && attendees.length) {
    const hit = attendees.find(a => {
      const an = a.toLowerCase();
      return an === key || an.split(" ")[0] === key.split(" ")[0];
    });
    if (hit) {
      const known = people.find(p =>
        p.name.toLowerCase() === hit.toLowerCase() || p.aliases.includes(hit.toLowerCase()));
      return known ? known.name : hit;
    }
  }

  const known = people.find(p =>
    p.name.toLowerCase() === key || p.aliases.includes(key) ||
    p.name.toLowerCase().split(" ")[0] === key.split(" ")[0]);

  return known ? known.name : titleCase(raw.trim());
}

function addPerson(name) {
  const clean = titleCase(String(name).trim());
  if (!clean) return null;
  const found = people.find(p =>
    p.name.toLowerCase() === clean.toLowerCase() || p.aliases.includes(clean.toLowerCase()));
  if (found) return found.name;
  people.push({ name: clean, aliases: [clean.toLowerCase(), clean.split(" ")[0].toLowerCase()] });
  return clean;
}

function longStamp(value) {
  const d = new Date(value);
  if (isNaN(d)) return String(value);
  const day = d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  const time = d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  const diff = Math.floor((new Date(TODAY) - new Date(String(value).slice(0, 10))) / 86400000);
  const rel = diff === 0 ? "today" : diff === 1 ? "yesterday" : diff > 1 ? diff + " days ago" : "";
  return "Discussed " + day + " at " + time + (rel ? " (" + rel + ")" : "");
}

function shortStamp(value) {
  const d = new Date(value);
  if (isNaN(d)) return "";
  return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" }) + " " +
         d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
}

function whenLabel(task) {
  const w = task.sourceRef && task.sourceRef.when;
  return w && shortStamp(w) ? shortStamp(w) : task.source;
}

function inOwnerScope(t) {
  if (state.ownerFilter) return t.owner === state.ownerFilter;
  if (state.ownerScope === "Mine") return t.owner === ME;
  if (state.ownerScope === "Team") return t.owner !== ME;
  return true;
}

function isTodayBucket(t) {
  return t.due === TODAY && effectiveStatus(t) === "Pending";
}

function isPendingBucket(t) {
  return effectiveStatus(t) === "Pending" && t.due !== TODAY;
}

function getCounts(list) {
  return {
    All: list.length,
    New: list.filter(t => t.isNew && effectiveStatus(t) !== "Completed").length,
    Today: list.filter(isTodayBucket).length,
    Pending: list.filter(isPendingBucket).length,
    Waiting: list.filter(t => effectiveStatus(t) === "Waiting").length,
    Overdue: list.filter(t => effectiveStatus(t) === "Overdue").length,
    Completed: list.filter(t => effectiveStatus(t) === "Completed").length
  };
}

function getPriorityCounts(list) {
  return Object.fromEntries(PRIORITIES.map(priority => [
    priority, list.filter(t => (t.priority || "Medium") === priority).length
  ]));
}

function getVisible() {
  const q = state.query.toLowerCase();
  return state.tasks.filter(t => {
    if (!inOwnerScope(t)) return false;
    const s = effectiveStatus(t);
    const sec =
      state.section === "New"       ? t.isNew && s !== "Completed" :
      state.section === "Today"     ? isTodayBucket(t) :
      state.section === "Pending"   ? isPendingBucket(t) :
      state.section === "Waiting"   ? s === "Waiting" :
      state.section === "Overdue"   ? s === "Overdue" :
      state.section === "Completed" ? s === "Completed" : true;

    const priority = state.priority === "All" || (t.priority || "Medium") === state.priority;

    const proj = state.project === "All projects" || t.project === state.project;
    const src = state.source === "All sources" || t.source === state.source;
    const age = state.days === "All" || !t.created ||
      Math.floor((new Date(TODAY) - new Date(t.created)) / 86400000) <= Number(state.days);
    const text = [t.title, t.details, t.project, t.source, t.sourceName, t.owner,
      ...(t.notes || []).map(n => n.text)].join(" ").toLowerCase();

    return sec && priority && proj && src && age && text.includes(q);
  });
}

function toast(message, kind) {
  const id = Date.now() + Math.random();
  state.toasts.push({ id, message, kind: kind || "" });
  render();
  setTimeout(() => {
    state.toasts = state.toasts.filter(t => t.id !== id);
    render();
  }, 3400);
}

/* ==================================================================
   Transcript parsing
================================================================== */
const EXPLICIT = /^\s*(?:action|todo|to-do|ai)\s*[:\-]\s*(.+)$/i;
const ASSIGNED = /^(.+?)\s+(?:will|to|should|needs? to|is going to)\s+(.+)$/i;
const COMMIT = /\b(i'?ll|i will|let me|i'?m going to)\b/i;

function parseTranscript(text, fileName) {
  const speakers = new Set();
  const utterances = [];

  text.split(/\r?\n/).forEach(raw => {
    const line = raw.trim();
    if (!line || /^WEBVTT/i.test(line) || /^\d+$/.test(line) || /-->/.test(line)) return;

    const vtt = line.match(/^<v\s+([^>]+)>(.*?)(?:<\/v>)?$/i);
    const colon = line.match(/^([A-Z][A-Za-z.'\- ]{1,40}?):\s+(.*)$/);

    if (vtt) { speakers.add(vtt[1].trim()); utterances.push({ speaker: vtt[1].trim(), text: vtt[2].trim() }); }
    else if (colon) { speakers.add(colon[1].trim()); utterances.push({ speaker: colon[1].trim(), text: colon[2].trim() }); }
    else utterances.push({ speaker: null, text: line });
  });

  const attendees = [...speakers];
  const found = [];

  utterances.forEach((u, i) => {
    const text = u.text;
    if (text.length < 12) return;

    let owner = null, title = null;
    const explicit = text.match(EXPLICIT);

    if (explicit) {
      title = explicit[1].trim();
      const who = title.match(/^([A-Za-z.'\- ]{2,30}?)\s+(?:to|will|should)\s+(.+)$/i);
      if (who) { owner = resolveName(who[1], attendees); title = who[2].trim(); }
      else owner = u.speaker ? resolveName(u.speaker, attendees) : ME;
    } else if (COMMIT.test(text)) {
      const m = text.match(COMMIT);
      const after = text.slice(m.index + m[0].length).trim();
      if (after.length > 8) {
        title = after.replace(/^(and|then|also)\s+/i, "");
        owner = u.speaker ? resolveName(u.speaker, attendees) : ME;
      }
    } else {
      const a = text.match(ASSIGNED);
      if (a && a[1].split(/\s+/).length <= 4 && a[2].length > 8) {
        const cand = resolveName(a[1], attendees);
        if (cand !== "Unassigned" && ownerNames().includes(cand)) { owner = cand; title = a[2].trim(); }
      }
    }

    if (!title) return;
    title = title.replace(/\s+/g, " ").replace(/[.,;]+$/, "");
    if (title.length > 120) title = title.slice(0, 117) + "...";
    if (title.length < 10) return;

    const context = utterances.slice(Math.max(0, i - 1), i + 2)
      .filter(x => x.speaker)
      .map(x => ({ speaker: resolveName(x.speaker, attendees), text: x.text }));

    found.push({
      include: true,
      title: title[0].toUpperCase() + title.slice(1),
      owner: owner || ME,
      fromAttendee: attendees.some(a => a.toLowerCase() === String(owner || "").toLowerCase()),
      details: text,
      discussion: context.length ? context : [{ speaker: owner || ME, text }],
      steps: [],
      source: "Uploaded transcript",
      sourceName: fileName,
      priority: "Medium",
      sourceRef: {
        kind: "meeting", title: fileName,
        when: new Date().toISOString().slice(0, 16),
        attendees, link: "#", linkLabel: "Uploaded file"
      }
    });
  });

  const seen = new Set();
  const unique = found.filter(f => {
    const k = f.title.toLowerCase().slice(0, 45);
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });

  unique.forEach(f => { if (f.owner && f.owner !== ME) addPerson(f.owner); });
  return { actions: unique.slice(0, 25), attendees, fileName };
}

function renderChecklistOverview() {
  const groups = {};
  state.tasks.forEach(task => {
    (task.checklist || []).forEach((subtask, index) => {
      const key = task.project || "Unassigned project";
      (groups[key] = groups[key] || []).push({ task, subtask, index });
    });
  });
  const total = Object.values(groups).flat().length;
  const done = Object.values(groups).flat().filter(item => item.subtask.done).length;

  return `
    <section class="checklist-overview">
      <div class="checklist-overview-head">
        <div>
          <h2>Checklist overview</h2>

function sanitizeRichHtml(value) {
  if (!value) return "";
  const template = document.createElement("template");
  template.innerHTML = String(value);
  const allowed = new Set(["B", "STRONG", "I", "EM", "U", "UL", "OL", "LI", "DIV", "P", "BR", "SPAN", "FONT"]);
  const safeColour = colour => /^(#[0-9a-f]{3}|#[0-9a-f]{6}|rgb\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*\)|[a-z]+)$/i.test(colour || "");
  template.content.querySelectorAll("*").forEach(node => {
    if (!allowed.has(node.tagName)) {
      node.replaceWith(document.createTextNode(node.textContent || ""));
      return;
    }
    [...node.attributes].forEach(attr => {
      const name = attr.name.toLowerCase();
      const val = attr.value.trim();
      if (name === "color" && safeColour(val)) return;
      if (name === "style" && /^color:\s*([^;]+);?$/i.test(val)) {
        const colour = val.match(/^color:\s*([^;]+);?$/i)[1].trim();
        if (safeColour(colour)) return;
      }
      node.removeAttribute(attr.name);
    });
  });
  return template.innerHTML;
}

function richPlainText(html) {
  if (!html) return "";
  const tmp = document.createElement("div");
  tmp.innerHTML = sanitizeRichHtml(html);
  tmp.querySelectorAll("br,li,p,div").forEach(node => node.appendChild(document.createTextNode("\n")));
  return tmp.textContent.replace(/\n{3,}/g, "\n\n").trim();
}

function noteHtml(note) {

function saveContext(id) {
  const g = sel => { const el = document.getElementById(sel); return el ? el.value.trim() : ""; };
  const kind = g("c-kind");
  const attendees = g("c-attendees").split(",").map(s => s.trim()).filter(Boolean);

  const quotes = [...document.querySelectorAll("[data-quote-speaker]")].map(el => {
    const i = el.dataset.quoteSpeaker;
    const textEl = document.querySelector(`[data-quote-text="${i}"]`);
    return { speaker: el.value.trim(), text: textEl ? textEl.value.trim() : "" };
  }).filter(q => q.text);

  // Anyone named as an attendee should be assignable.
  attendees.forEach(a => addPerson(a));

  state.tasks = state.tasks.map(t => {
    if (t.id !== id) return t;
    const ref = { ...(t.sourceRef || {}) };
    ref.kind = kind;
    ref.when = g("c-when");
    ref.link = g("c-link");
    ref.attendees = attendees;
    if (kind === "email") ref.subject = g("c-title"); else ref.title = g("c-title");
    return { ...t, sourceRef: ref, discussion: quotes, sourceName: g("c-title") || t.sourceName };
  });

  state.showContext = null;
  toast("Details corrected", "good");
}

/* Columns match the Microsoft List schema so the file imports directly. */
function exportCsv() {
  const cols = ["Title", "Details", "Project", "Owner", "Status", "Priority",
    "DueDate", "Source", "SourceName", "DiscussedOn", "Attendees", "SourceLink",
    "Steps", "LatestUpdate", "LastUpdated", "AllUpdates", "Detected"];

  const cell = v => {
    const s = v === null || v === undefined ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };

  const rows = state.tasks.map(t => {
    const notes = (t.notes || []).slice().sort((a, b) => a.at.localeCompare(b.at));
    const latest = notes[notes.length - 1];
    const ref = t.sourceRef || {};
    return [
      t.title, t.details, t.project,
      t.owner === ME ? "Me" : t.owner,
      effectiveStatus(t), t.priority, t.due || "",
      t.source, t.sourceName,
      ref.when || "",
      (ref.attendees || []).join("; "),
      ref.link || "",
      (t.steps || []).join(" | "),
      latest ? latest.text : "",
      latest ? latest.at : "",
      notes.map(n => "[" + n.at + "] " + n.text).join(" || "),
      t.created
    ].map(cell).join(",");
  });

  download(cols.join(",") + "\n" + rows.join("\n"),
    "action-tracker-" + TODAY + ".csv", "text/csv;charset=utf-8;");
  toast("CSV exported - import into your List", "good");
}

function exportJson() {
  download(JSON.stringify({ tasks: state.tasks, people, projects }, null, 2),
    "action-tracker-backup-" + TODAY + ".json", "application/json");
  toast("Backup exported", "good");
}

function download(content, filename, type) {
  const blob = new Blob(["\ufeff" + content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function setOwner(id, owner) {
  state.tasks = state.tasks.map(t => t.id === id ? { ...t, owner } : t);
  render();
}

function toggleToday(id) {
  state.tasks = state.tasks.map(t => {
    if (t.id !== id) return t;
    const pinned = t.due !== TODAY;
    return { ...t, isToday: pinned, due: pinned ? TODAY : "" };
  });
  render();
}

function addNote(id) {
  const box = document.getElementById("note-input");
  const html = box ? sanitizeRichHtml(box.innerHTML) : "";
  const text = richPlainText(html);
  if (!text) { toast("Write something first", "warn"); return; }

  const at = new Date().toISOString().slice(0, 16);
  state.tasks = state.tasks.map(t =>
    t.id === id ? { ...t, notes: [...(t.notes || []), { at, text, html }] } : t);
  state.noteDraft = "";
  state.showNoteInput = false;
  toast("Update saved", "good");
}

function editTaskCore(id) {
  const task = state.tasks.find(t => t.id === id);
  if (!task) return;
  const title = prompt("Edit task title", task.title);
  if (title === null) return;
  const details = prompt("Edit what you need to do", task.details || "");
  if (details === null) return;
  state.tasks = state.tasks.map(t => t.id === id ? { ...t, title: title.trim() || t.title, details: details.trim() } : t);
  render();
}

function deleteNote(id, at) {
  state.tasks = state.tasks.map(t =>
    t.id === id ? { ...t, notes: (t.notes || []).filter(n => n.at !== at) } : t);
  render();
}

function readTranscript(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try { state.parsed = parseTranscript(String(reader.result), file.name); render(); }
    catch (err) { toast("Could not read that file", "warn"); }
  };
  reader.onerror = () => toast("Could not read that file", "warn");
  reader.readAsText(file);
}

function importParsed() {
  const chosen = state.parsed.actions.filter(a => a.include);
  if (!chosen.length) { toast("Nothing selected", "warn"); return; }
  const el = document.getElementById("parsed-project");
  const project = el ? el.value : projects[0];

  state.tasks = [
    ...chosen.map((a, i) => ({
      id: Date.now() + i, title: a.title, details: a.details, project,
      owner: a.owner, source: a.source, sourceName: a.sourceName,
      created: TODAY, due: "", status: "Open", priority: a.priority,
      isNew: true, notes: [], discussion: a.discussion, steps: a.steps, sourceRef: a.sourceRef
    })),
    ...state.tasks
  ];

  state.showUpload = false;
  state.parsed = null;
  toast(chosen.length + " action" + (chosen.length === 1 ? "" : "s") + " imported", "good");
}

function saveProjects() {
  const renamed = [];
  [...document.querySelectorAll("[data-project-name]")].forEach(input => {
    const i = Number(input.dataset.projectName);
    const before = projects[i];
    const after = input.value.trim();
    if (after && before !== after) renamed.push([before, after]);
    if (after) projects[i] = after;
  });

  renamed.forEach(([before, after]) => {
    state.tasks = state.tasks.map(t => t.project === before ? { ...t, project: after } : t);
    if (state.project === before) state.project = after;
  });

  projects = [...new Set(projects.filter(Boolean))];
  state.showProjects = false;
  toast("Projects updated", "good");
}

function savePeople() {
  const editable = people.filter(p => p.name !== ME && p.name !== "Unassigned");
  const renamed = [];

  [...document.querySelectorAll("[data-person-name]")].forEach(input => {
    const i = Number(input.dataset.personName);
    const before = editable[i] && editable[i].name;
    const after = input.value.trim();
    if (!before || !after || before === after) return;
    renamed.push([before, after]);
    const entry = people.find(p => p.name === before);
    if (entry) {
      entry.name = after;
      entry.aliases = [...new Set([...entry.aliases, after.toLowerCase(), after.split(" ")[0].toLowerCase()])];
    }
  });

  renamed.forEach(([before, after]) => {
    state.tasks = state.tasks.map(t => t.owner === before ? { ...t, owner: after } : t);
    if (state.ownerFilter === before) state.ownerFilter = after;
  });

  state.showPeople = false;
  toast(renamed.length ? "People updated" : "No changes", renamed.length ? "good" : "");
}

function saveTask() {
  readDraft();
  if (!state.draft.title.trim()) {
    state.formError = "Give the action a title.";
    render();
    const el = document.getElementById("f-title");
    if (el) el.focus();
    return;
  }
  const subtasks = state.draft.subtasks.split(/\r?\n/).map(text => text.trim()).filter(Boolean).map(text => ({ text, done: false, owner: d.owner, due: "", notes: [], checklist: [] }));
  const notes = state.draft.initialUpdate.trim()
    ? [{ at: new Date().toISOString().slice(0, 16), text: state.draft.initialUpdate.trim() }]
    : [];
  const taskId = Date.now();
  state.tasks = [{
    id: taskId, ...state.draft,
    source: "Ad-hoc request", sourceName: "Manually added",
    created: TODAY, status: "Open", isNew: true, notes, subtasks, checklist: [],
    discussion: [], steps: [], sourceRef: null
  }, ...state.tasks];
  state.draft = { title: "", details: "", project: "", owner: ME, due: "", priority: "Medium", initialUpdate: "", subtasks: "" };
  state.selected = taskId;
  state.formError = "";
  state.showForm = false;
  render();
}

function saveEmailAction() {
  readEmailDraft();
  const d = state.emailDraft;
  if (!d.subject || !d.title || !d.body) {
    toast("Subject, action title and email content are required", "warn");
    return;
  }
  const received = d.received || new Date().toISOString().slice(0, 16);
  const attachments = d.attachment
    ? d.attachment.split(",").map(name => name.trim()).filter(Boolean).map(name => ({ name, size: "" }))
    : [];
  const task = {
    id: Date.now(), title: d.title, details: d.nextStep || d.body,
    project: d.project, owner: d.owner, source: "Flagged email", sourceName: d.subject,
    created: TODAY, due: "", status: "Open", priority: d.priority, isNew: true,
    notes: [], subtasks: d.nextStep ? [{ text: d.nextStep, done: false, owner: d.owner, due: "", notes: [], checklist: [] }] : [], checklist: [],
    discussion: [{ speaker: d.from || "Email sender", text: d.body }], steps: d.nextStep ? [d.nextStep] : [],
    sourceRef: { kind: "email", subject: d.subject, from: d.from, to: d.to, when: received,
      link: "#", linkLabel: "Open email", attachments }
  };
  state.tasks = [task, ...state.tasks];
  state.selected = task.id;
  state.showEmail = false;
  state.emailDraft = { subject: "", from: "", to: "", received: "", body: "", attachment: "", title: "", nextStep: "", project: projects[0], owner: ME, priority: "High" };
  toast("Flagged email added to your action tracker", "good");
}

function addSubtask(id) {
  const input = document.getElementById("subtask-input");
  const text = input ? input.value.trim() : "";
  if (!text) { toast("Write a subtask first", "warn"); return; }
  state.tasks = state.tasks.map(t => t.id === id ? { ...t, subtasks: [...(t.subtasks || []), { text, done: false, owner: t.owner, due: "", notes: [], checklist: [] }] } : t);
  render();
}

function moveSubtask(taskId, from, to) {
  if (from === to || from < 0 || to < 0) return;
  state.tasks = state.tasks.map(t => {
    if (t.id !== taskId) return t;
    const subtasks = [...(t.subtasks || [])];
    const [item] = subtasks.splice(from, 1);
    if (!item) return t;
    subtasks.splice(to, 0, item);
    return { ...t, subtasks };
  });
  render();
}

function addSubtaskChecklist() {
  const ref = state.showSubtask;
  const input = document.getElementById("st-checklist-input");
  const text = input ? input.value.trim() : "";
  if (!text) { toast("Write a checklist item first", "warn"); return; }
  state.tasks = state.tasks.map(t => t.id === ref.taskId
    ? { ...t, subtasks: (t.subtasks || []).map((s, index) => index === ref.index ? { ...s, checklist: [...(s.checklist || []), { text, done: false }] } : s) }
    : t);
  render();
}

function saveSubtask() {
  const ref = state.showSubtask;
  const get = id => document.getElementById(id)?.value.trim() || "";
  state.tasks = state.tasks.map(t => {
    if (t.id !== ref.taskId) return t;
    const subtasks = (t.subtasks || []).map((s, index) => index === ref.index
      ? { ...s, text: get("st-text") || s.text, owner: get("st-owner") || ME, due: get("st-due"), done: get("st-status") === "Completed" }
      : s);
    return { ...t, subtasks };
  });
  state.showSubtask = null;
  toast("Subtask saved", "good");
}

function addSubtaskNote() {
  const editor = document.getElementById("st-note");
  const html = editor ? sanitizeRichHtml(editor.innerHTML) : "";
  const text = richPlainText(html);
  if (!text) { toast("Write an update first", "warn"); return; }
  const ref = state.showSubtask;
  state.tasks = state.tasks.map(t => {
    if (t.id !== ref.taskId) return t;
    return { ...t, subtasks: (t.subtasks || []).map((s, index) => index === ref.index
      ? { ...s, notes: [...(s.notes || []), { at: new Date().toISOString().slice(0, 16), text, html }] }
      : s) };
  });
  toast("Subtask update saved", "good");
}

/* ==================================================================
   Events
================================================================== */
function bind() {
  const root = document.getElementById("root");

  root.querySelectorAll("[data-group-toggle]").forEach(el =>
    el.onclick = () => {
      const group = el.dataset.groupToggle;
      state.navGroups[group] = !state.navGroups[group];
      render();
    });

  root.querySelectorAll("[data-section]").forEach(el =>
    el.onclick = () => { state.section = el.dataset.section; state.showChecklist = false; render(); });

  root.querySelectorAll("[data-priority]").forEach(el =>
    el.onclick = () => { state.priority = el.dataset.priority; render(); });

  root.querySelectorAll("[data-scope]").forEach(el =>
    el.onclick = () => { state.ownerScope = el.dataset.scope; state.ownerFilter = null; render(); });

  root.querySelectorAll("[data-owner-all]").forEach(el =>
    el.onclick = () => { state.ownerScope = "All"; state.ownerFilter = null; render(); });

  root.querySelectorAll("[data-owner-filter]").forEach(el =>
    el.onclick = () => {
      const owner = el.dataset.ownerFilter;
      state.ownerScope = "All";
      state.ownerFilter = state.ownerFilter === owner ? null : owner;
      render();
    });

  root.querySelectorAll("[data-project]").forEach(el =>
    el.onclick = () => {
      state.project = state.project === el.dataset.project ? "All projects" : el.dataset.project;
      render();
    });

  root.querySelectorAll("[data-project-all]").forEach(el =>
    el.onclick = () => { state.project = "All projects"; render(); });

  root.querySelectorAll("[data-open]").forEach(el =>
    el.onclick = () => {
      state.selected = Number(el.dataset.open);
      state.noteDraft = "";
      state.showNoteInput = false;
      render();
    });

  root.querySelectorAll("[data-today-toggle]").forEach(el =>
    el.onclick = event => {
      event.stopPropagation();
      toggleToday(Number(el.dataset.todayToggle));
    });

  root.querySelectorAll("[data-due-set]").forEach(el =>
    el.onchange = () => {
      const id = Number(el.dataset.dueSet);
      state.tasks = state.tasks.map(t => t.id === id ? { ...t, due: el.value } : t);
      render();
    });

  root.querySelectorAll("select[data-owner-set]").forEach(el =>
    el.onchange = () => {
      const id = Number(el.dataset.ownerSet);
      if (el.value === "__add__") {
        const name = prompt("Name of the person to assign this to:");
        const added = name ? addPerson(name) : null;
        if (added) { setOwner(id, added); toast("Assigned to " + added, "good"); } else render();
        return;
      }
      setOwner(id, el.value);
    });

  root.querySelectorAll("select[data-status-set]").forEach(el =>
    el.onchange = () => {
      const id = Number(el.dataset.statusSet);
      state.tasks = state.tasks.map(t => t.id === id ? { ...t, status: el.value, isNew: false } : t);
      if (el.value === "Completed") state.selected = null;
      render();
    });

  root.querySelectorAll("select[data-priority-set]").forEach(el =>
    el.onchange = () => {
      const id = Number(el.dataset.prioritySet);
      state.tasks = state.tasks.map(t => t.id === id ? { ...t, priority: el.value } : t);
      render();
    });

  root.querySelectorAll("button[data-owner-set]").forEach(el =>
    el.onclick = () => setOwner(Number(el.dataset.ownerSet), el.dataset.ownerValue));

  root.querySelectorAll("select[data-project-set]").forEach(el =>
    el.onchange = () => {
      const id = Number(el.dataset.projectSet);
      if (el.value === "__add__") {
        const name = prompt("New project name:");
        if (name && name.trim()) {
          const clean = name.trim();
          if (!projects.includes(clean)) projects.push(clean);
          state.tasks = state.tasks.map(t => t.id === id ? { ...t, project: clean } : t);
          toast("Moved to " + clean, "good");
        }
        render();
        return;
      }
      state.tasks = state.tasks.map(t => t.id === id ? { ...t, project: el.value } : t);
      render();
    });

  root.querySelectorAll("[data-project-del]").forEach(el =>
    el.onclick = () => { projects.splice(Number(el.dataset.projectDel), 1); render(); });

  root.querySelectorAll("[data-person-del]").forEach(el =>
    el.onclick = () => {
      const editable = people.filter(p => p.name !== ME && p.name !== "Unassigned");
      const target = editable[Number(el.dataset.personDel)];
      if (!target) return;
      state.tasks = state.tasks.map(t => t.owner === target.name ? { ...t, owner: "Unassigned" } : t);
      people = people.filter(p => p.name !== target.name);
      render();
    });

  root.querySelectorAll("[data-note-del]").forEach(el =>
    el.onclick = () => deleteNote(Number(el.dataset.id), el.dataset.noteDel));

  root.querySelectorAll("[data-subtask-toggle]").forEach(el =>
    el.onchange = () => {
      const id = Number(el.dataset.subtaskToggle);
      const index = Number(el.dataset.subtaskIndex);
      state.tasks = state.tasks.map(t => t.id === id
        ? { ...t, subtasks: (t.subtasks || []).map((s, i) => i === index ? { ...s, done: el.checked } : s) }
        : t);
      render();
    });

  root.querySelectorAll("[data-subtask-checklist-toggle]").forEach(el =>
    el.onchange = () => {
      const ref = state.showSubtask;
      const index = Number(el.dataset.subtaskChecklistToggle);
      state.tasks = state.tasks.map(t => t.id === ref.taskId
        ? { ...t, subtasks: (t.subtasks || []).map((s, subIndex) => subIndex === ref.index ? { ...s, checklist: (s.checklist || []).map((item, itemIndex) => itemIndex === index ? { ...item, done: el.checked } : item) } : s) }
        : t);
      render();
    });

  root.querySelectorAll("[data-subtask-drag]").forEach(el => {
    el.ondragstart = event => {
      state.draggingSubtask = { taskId: Number(el.dataset.subtaskDrag), index: Number(el.dataset.subtaskIndex) };
      event.dataTransfer.effectAllowed = "move";
    };
    el.ondragover = event => { event.preventDefault(); el.classList.add("drag-over"); };
    el.ondragleave = () => el.classList.remove("drag-over");
    el.ondrop = event => {
      event.preventDefault();
      el.classList.remove("drag-over");
      const from = state.draggingSubtask;
      const taskId = Number(el.dataset.subtaskDrop);
      const to = Number(el.dataset.subtaskIndex);
      state.draggingSubtask = null;
      if (from && from.taskId === taskId) moveSubtask(taskId, from.index, to);
    };
  });

  root.querySelectorAll("[data-subtask-open]").forEach(el =>
    el.onclick = event => {
      if (event.target.matches("input")) return;
      state.showSubtask = { taskId: Number(el.dataset.subtaskOpen), index: Number(el.dataset.subtaskIndex) };
      render();
    });

  root.querySelectorAll("[data-subtask-note-del]").forEach(el =>
    el.onclick = () => {
      const ref = state.showSubtask;
      state.tasks = state.tasks.map(t => t.id === ref.taskId
        ? { ...t, subtasks: (t.subtasks || []).map((s, index) => index === ref.index ? { ...s, notes: (s.notes || []).filter(n => n.at !== el.dataset.subtaskNoteDel) } : s) }
        : t);
      render();
    });

  root.querySelectorAll("[data-quote-del]").forEach(el =>
    el.onclick = () => {
      const id = Number(el.dataset.id);
      const i = Number(el.dataset.quoteDel);
      state.tasks = state.tasks.map(t =>
        t.id === id ? { ...t, discussion: t.discussion.filter((_, idx) => idx !== i) } : t);
      render();
    });

  root.querySelectorAll("[data-parsed]").forEach(el =>
    el.onchange = () => { state.parsed.actions[Number(el.dataset.parsed)].include = el.checked; });

  root.querySelectorAll("[data-parsed-owner]").forEach(el =>
    el.onchange = () => { state.parsed.actions[Number(el.dataset.parsedOwner)].owner = el.value; });

  root.querySelectorAll("[data-rich-cmd]").forEach(btn =>
    btn.onclick = event => {
      event.preventDefault();
      const editorId = btn.closest(".rich-toolbar")?.dataset.editor;
      const editor = editorId ? document.getElementById(editorId) : null;
      if (!editor) return;
      editor.focus();
      document.execCommand(btn.dataset.richCmd, false, null);
    });

  root.querySelectorAll("[data-rich-color]").forEach(select =>
    select.onchange = event => {
      event.preventDefault();
      const editorId = select.closest(".rich-toolbar")?.dataset.editor;
      const editor = editorId ? document.getElementById(editorId) : null;
      if (!editor || !select.value) return;
      editor.focus();
      document.execCommand("foreColor", false, select.value);
      select.value = "";
    });

  root.querySelectorAll("[data-theme-toggle]").forEach(el =>
    el.onchange = () => {
      state.darkMode = el.checked;
      render();
    });

  root.querySelectorAll("[data-act]").forEach(el =>
    el.onclick = event => {
      const act = el.dataset.act;
      if (el.classList.contains("overlay") && event.target !== el) return;

      if (act === "open-form") { state.showForm = true; state.formError = ""; }
      if (act === "toggle-note-input") { state.showNoteInput = !state.showNoteInput; return render(); }
      if (act === "close-form") { readDraft(); state.showForm = false; }
      if (act === "open-email") { state.showEmail = true; }
      if (act === "close-email") { readEmailDraft(); state.showEmail = false; }
      if (act === "save-email") return saveEmailAction();
      if (act === "clear-owner") state.ownerFilter = null;
      if (act === "back") state.selected = null;
      if (act === "open-upload") { state.showUpload = true; state.parsed = null; }
      if (act === "close-upload") { state.showUpload = false; state.parsed = null; }
      if (act === "reset-upload") state.parsed = null;
      if (act === "import-parsed") return importParsed();
      if (act === "manage-projects") state.showProjects = true;
      if (act === "close-projects") state.showProjects = false;
      if (act === "add-project-row") projects.push("New project");
      if (act === "save-projects") return saveProjects();
      if (act === "manage-people") state.showPeople = true;
      if (act === "close-people") state.showPeople = false;
      if (act === "open-settings") state.showSettings = true;
      if (act === "close-settings") state.showSettings = false;
      if (act === "add-person-row") addPerson("New person");
      if (act === "save-people") return savePeople();
      if (act === "add-note") return addNote(Number(el.dataset.id));
      if (act === "add-subtask") return addSubtask(Number(el.dataset.id));
      if (act === "add-subtask-checklist") return addSubtaskChecklist();
      if (act === "add-subtask-note") return addSubtaskNote();
      if (act === "save-subtask") return saveSubtask();
      if (act === "close-subtask") state.showSubtask = null;
      if (act === "edit-task-core") return editTaskCore(Number(el.dataset.id));
      if (act === "edit-context") state.showContext = Number(el.dataset.id);
      if (act === "close-context") state.showContext = null;
      if (act === "save-context") return saveContext(Number(el.dataset.id));
      if (act === "export-csv") return exportCsv();
      if (act === "export-json") return exportJson();
      if (act === "save") return saveTask();
      render();
    });

  const search = document.getElementById("search");
  if (search) search.oninput = () => {
    state.query = search.value;
    render();
    const next = document.getElementById("search");
    next.focus();
    next.setSelectionRange(next.value.length, next.value.length);
  };

  const noteBox = document.getElementById("note-input");
  if (noteBox) {
    noteBox.oninput = () => { state.noteDraft = sanitizeRichHtml(noteBox.innerHTML); };
    noteBox.onkeydown = e => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        addNote(state.selected);
      }
    };
  }

  const subtaskNoteBox = document.getElementById("st-note");
  if (subtaskNoteBox) {
    subtaskNoteBox.onkeydown = e => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        addSubtaskNote();
      }
    };
  }

  const days = document.getElementById("days");
  if (days) days.onchange = () => { state.days = days.value; render(); };

  const fp = document.getElementById("fproject");
  if (fp) fp.onchange = () => { state.project = fp.value; render(); };

  const fs = document.getElementById("fsource");
  if (fs) fs.onchange = () => { state.source = fs.value; render(); };

  const dz = document.getElementById("dropzone");
  const fi = document.getElementById("file-input");
  if (dz && fi) {
    dz.onclick = () => fi.click();
    dz.ondragover = e => { e.preventDefault(); dz.classList.add("over"); };
    dz.ondragleave = () => dz.classList.remove("over");
    dz.ondrop = e => {
      e.preventDefault();
      dz.classList.remove("over");
      if (e.dataTransfer.files[0]) readTranscript(e.dataTransfer.files[0]);
    };
    fi.onchange = () => { if (fi.files[0]) readTranscript(fi.files[0]); };
  }
}

document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (state.showForm || state.showEmail || state.showUpload || state.showProjects || state.showPeople || state.showSettings || state.showSubtask) {
    state.showForm = state.showEmail = state.showUpload = state.showProjects = state.showPeople = state.showSettings = false;
    state.showSubtask = null;
    render();
  } else if (state.selected) {
    state.selected = null;
    render();
  }
});

load();
render();
if (!state.storageOk) toast("Notes cannot be saved in this browser", "warn");
</script>
</body>
</html>
